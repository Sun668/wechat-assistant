[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-reply-assistant"
version = "0.5.0"
description = "Owner-only WeChat transport gateway for native ChatGPT projects"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "qrcode[pil]>=8,<9",
  "cryptography>=46,<48",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
wechat-assistant = "wechat_assistant.projects.cli:main"
clawbot-projects = "wechat_assistant.projects.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
